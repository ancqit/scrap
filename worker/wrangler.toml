name = "scrap-r2-presign"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Account id is the R2 S3 endpoint host, not a secret.
# This is the bucket junctionBack already uses (R2_BUCKET=junction-shorts).
# Scrap objects live under 2001/. Junction shorts stay under shorts/.
# S3 signing remains available when R2_ACCESS_KEY_ID is set, and matches
# junctionBack: s3v4, region auto.
[vars]
ACCOUNT_ID = "f1d24d5e867a3d29f557db38d7fe5aab"
BUCKET = "junction-shorts"
PUBLIC_BASE_URL = "https://media.junction.monster"
ALLOWED_ORIGIN = "http://localhost:4200,http://127.0.0.1:4200"

[[r2_buckets]]
binding = "SCRAP"
bucket_name = "junction-shorts"

# Secrets, set with wrangler (never commit them):
#   npx wrangler secret put R2_ACCESS_KEY_ID
#   npx wrangler secret put R2_SECRET_ACCESS_KEY
